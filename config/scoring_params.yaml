# PRD v1.1 §12 評分參數化要求
# 所有門檻、滿分、期間皆由本檔管理，核心程式不得寫死。
version: "1.1.0"

periods:
  # 「近五個完整年度」的年數。不足此數者整家公司 N/A（PRD §3、§8.1）
  annual_years: 5

factors:
  eps:
    max_score: 2
    mild_decline_pct: 5.0      # 下降幅度 <= 此值視為可接受（剛好 5% 通過）
    severe_decline_pct: 12.0   # 下降幅度 > 此值為大幅衰退（剛好 12% 仍屬 0.5 區間）
    stability_full: 1.0
    stability_partial: 0.5
    growth_bonus: 1.0
    negative_eps_zeroes_factor: true   # 任一年 EPS<0 → 整項 0（PRD §10.1）
  free_cash_flow:
    max_score: 1
    min_value: 0.0             # 五年全部 > min_value
  dividend:
    max_score: 2
    paid_all_years_score: 1.0
    stability_score: 1.0
    max_yoy_decline_pct: 5.0   # 年減幅 <= 5% 通過（剛好 -5% 通過）
  payout_ratio:
    max_score: 2
    zero_score: 0.0            # Payout = 0% → 0 分
    tier1_upper_pct: 50.0      # 0% < p < 50% → tier1_score
    tier1_score: 2.0
    tier2_upper_pct: 100.0     # 50% <= p < 100% → tier2_score
    tier2_score: 1.0
    over_cap_score: 0.0        # p >= 100% → 0
    negative_eps_score: 0.0    # TTM EPS < 0 → 0
  net_margin:
    max_score: 2
    high_pct: 20.0             # 五年皆 > 20% → high_score
    high_score: 2.0
    base_pct: 10.0             # 五年皆 > 10% → base_score
    base_score: 1.0
    growth_score: 1.0          # 五年逐年嚴格成長 → growth_score
  lt_debt_equity:
    max_score: 1
    threshold: 0.5             # < 0.5 得分
    pass_score: 1.0
    negative_equity_score: 0.0 # 股東權益 <= 0 → 0 並標示高風險警示
  interest_coverage:
    max_score: 2
    high_threshold: 20.0       # > 20 → 2
    high_score: 2.0
    mid_threshold: 10.0        # > 10 且 <= 20 → 1
    mid_score: 1.0
    low_score: 0.0             # <= 10 → 0
    no_debt_positive_op_score: 2.0  # 無利息負擔且營業利益 > 0 → 2
    no_debt_nonpositive_op_score: 0.0
  roe:
    max_score: 2
    high_pct: 15.0             # 五年皆 >= 15% → 2
    high_score: 2.0
    base_pct: 12.0             # 五年皆 >= 12% → 1
    base_score: 1.0
  roic:
    max_score: 1
    threshold_pct: 10.0        # 五年皆 >= 10% → 1
    pass_score: 1.0
  director_holding:
    max_score: 1
    min_holding_pct: 10.0      # > 10% 得分（剛好 10% 不得分）
    max_pledge_pct: 20.0       # 質押 > 20% 取消得分（剛好 20% 不觸發）
    pass_score: 1.0

# PRD §12：第一版所有因子權重皆 1.0，原始分數與加權分數分開保存
weights:
  eps: 1.0
  free_cash_flow: 1.0
  dividend: 1.0
  payout_ratio: 1.0
  net_margin: 1.0
  lt_debt_equity: 1.0
  interest_coverage: 1.0
  roe: 1.0
  roic: 1.0
  director_holding: 1.0

# PRD §8.12 金融業部分評分矩陣
financial_sector:
  applicable_factors: [eps, dividend, payout_ratio, roe, director_holding]
  max_score: 9
  apply_general_threshold: false   # 金融業不套用 10 分門檻
  rank_separately: true

general_sector:
  max_score: 16
  screening_threshold: 10          # 選股參考門檻
